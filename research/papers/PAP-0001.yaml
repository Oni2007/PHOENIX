claims:
  - claim_id: "PAP-0001-C1"
    statement: "The TPU's matrix multiply unit offers a peak throughput of 92 TeraOps/second (TOPS)."
    quantity: {name: "peak int8 throughput", value: 92.0, unit: "TOPS"}
    evidence_class: ANALYTICAL
    scope: "peak throughput of the 65,536-MAC systolic array only, int8 precision, on production TPU v1 silicon -- a design-computed figure (MAC count x clock x 2), not a workload benchmark"
    excludes:
      - "host CPU, PCIe transfer, DRAM/HBM, and control-logic power or latency"
      - "any workload-achieved (as opposed to design-peak) figure"
    uncertainty_reported: false
    confidence_in_claim: HIGH

  - claim_id: "PAP-0001-C2"
    statement: "The TPU is reported as on average about 15x-30x faster than contemporary GPU or CPU on the authors' production inference workload mix."
    evidence_class: MEASURED
    scope: "aggregate speedup across Google's production inference workloads (MLPs, CNNs, LSTMs), TPU v1 vs contemporaneous Haswell CPU and Nvidia K80 GPU, as deployed in Google datacenters, verbatim from the paper's abstract"
    excludes:
      - "training workloads (TPU v1 is described as inference-only, so this cannot describe training)"
      - "does not represent a peak/theoretical figure -- this is an aggregate empirical average across a workload mix, not a single-kernel benchmark"
    uncertainty_reported: false
    confidence_in_claim: HIGH

  - claim_id: "PAP-0001-C3"
    statement: "The TPU's TOPS/Watt is reported as about 30x-80x higher than contemporary GPU or CPU."
    evidence_class: MEASURED
    scope: "same production-inference comparison as PAP-0001-C2"
    excludes:
      - "UNRESOLVED AT THIS REVIEW DEPTH: the paper separately reports 'Total' performance/Watt (including host server power) and 'Incremental' performance/Watt (accelerator chip only, per Figure 9's caption). Which of these two scopes the abstract's headline 30x-80x figure refers to was not determined here -- a genuine open question, recorded rather than resolved by assumption. Requires a FULL_READ pass on Figure 9 and its surrounding text before this claim can be cited with a specific scope."
    uncertainty_reported: true
    confidence_in_claim: MEDIUM

  - claim_id: "PAP-0001-C4"
    statement: "The paper projects that using the GPU's GDDR5-class memory in a TPU would triple achieved TOPS and raise TOPS/Watt to nearly 70x the GPU and 200x the CPU."
    evidence_class: PROJECTED
    scope: "a hypothetical TPU memory configuration explicitly not the deployed/measured TPU v1 (which uses DDR3)"
    excludes:
      - "not achieved on real, deployed hardware -- this is the paper authors' own extrapolation, stated as such in the abstract"
    uncertainty_reported: false
    confidence_in_claim: HIGH

