[project]
name = "phoenix"
version = "0.1.0.dev0"
description = "Measurement, benchmarking and provenance infrastructure for AI accelerators"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }

dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "structlog>=24.1",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pyarrow>=16.0",
  "polars>=1.0",
  "duckdb>=1.0",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "blake3>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10", "cmake>=3.24", "ninja>=1.11", "nanobind>=2.0"]

[project.scripts]
phoenix = "phoenix.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/phoenix"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["python/phoenix"]
mypy_path = "python"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["phoenix_core.*", "blake3.*", "duckdb.*", "pyarrow.*", "scipy.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
